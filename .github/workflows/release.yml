name: Publish reviewed CLI
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: python3 .release/verify.py
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - run: python3 .release/verify.py "$RUNNER_TEMP/vecteur-cli-0.10.0.tgz"
      - run: npm publish "$RUNNER_TEMP/vecteur-cli-0.10.0.tgz" --provenance --access public --ignore-scripts --tag candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
